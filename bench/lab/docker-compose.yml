# Latency lab: Conduit + real nodes (VLESS+WS, NODE_DELAY_MS added RTT) + a local target.
# node1/node2 run Xray (typical for "?ed=2048" links); node3/node4 run sing-box (needed for sing-box multiplex).
# Driven by bench/lab/run.sh; not for production.
name: conduit-lab

networks:
  lab:
    ipam:
      config:
        - subnet: 172.28.0.0/24

services:
  target:
    image: nginx:alpine
    # Large accept backlog so the target is never the bottleneck (nginx defaults to 511)
    command: ["sh", "-c", "sed -i 's/listen       80;/listen 80 backlog=65535;/' /etc/nginx/conf.d/default.conf && sed -i 's/worker_connections  1024;/worker_connections 65535;/' /etc/nginx/nginx.conf && exec nginx -g 'daemon off;'"]
    sysctls: &lab_sysctls
      net.core.somaxconn: 65535
      net.ipv4.tcp_max_syn_backlog: 65535
    ulimits: &lab_ulimits
      nofile: {soft: 1048576, hard: 1048576}
    networks: {lab: {ipv4_address: 172.28.0.20}}

  node1: &node
    build: {context: ., dockerfile: node.Dockerfile}
    image: conduit-lab-node
    cap_add: [NET_ADMIN]
    sysctls: *lab_sysctls
    ulimits: *lab_ulimits
    environment:
      - NODE_DELAY_MS=${NODE_DELAY_MS:-100}
      - NODE_KIND=xray
    networks: {lab: {ipv4_address: 172.28.0.10}}

  node2:
    <<: *node
    networks: {lab: {ipv4_address: 172.28.0.11}}

  node3:
    <<: *node
    environment:
      - NODE_DELAY_MS=${NODE_DELAY_MS:-100}
      - NODE_KIND=sing-box
    networks: {lab: {ipv4_address: 172.28.0.12}}

  node4:
    <<: *node
    environment:
      - NODE_DELAY_MS=${NODE_DELAY_MS:-100}
      - NODE_KIND=sing-box
    networks: {lab: {ipv4_address: 172.28.0.13}}

  conduit:
    image: ${CONDUIT_IMAGE:-conduit:bench}
    environment:
      - CONDUIT_WEB_PORT=7782
    # Same limits for every image under test, so runs differ only by the image
    sysctls: *lab_sysctls
    ulimits: *lab_ulimits
    networks: {lab: {ipv4_address: 172.28.0.30}}

  bench:
    image: python:3.11-slim
    volumes:
      - ../:/bench
    working_dir: /bench
    command: ["sleep", "infinity"]
    sysctls: *lab_sysctls
    ulimits: *lab_ulimits
    networks: {lab: {ipv4_address: 172.28.0.40}}
