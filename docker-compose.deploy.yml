# Conduit - deploy with the pre-built image (no build on your machine).
# Image: ghcr.io/sajjadsaharkhan/conduit:main
#
# Usage:
#   cp .env.example .env   # optional: change ports / admin login
#   docker compose -f docker-compose.deploy.yml up -d

services:
  conduit:
    image: ghcr.io/sajjadsaharkhan/conduit:main
    container_name: conduit
    ports:
      - "${CONDUIT_WEB_PORT:-7782}:${CONDUIT_WEB_PORT:-7782}"                    # Web UI + API
      - "${CONDUIT_HYBRID_HTTP_PORT:-8080}:${CONDUIT_HYBRID_HTTP_PORT:-8080}"    # HTTP proxy (hybrid)
      - "${CONDUIT_FULL_HTTP_PORT:-8081}:${CONDUIT_FULL_HTTP_PORT:-8081}"        # HTTP proxy (full tunnel)
      - "${CONDUIT_HYBRID_SOCKS_PORT:-1080}:${CONDUIT_HYBRID_SOCKS_PORT:-1080}"  # SOCKS5 (hybrid)
      - "${CONDUIT_FULL_SOCKS_PORT:-1081}:${CONDUIT_FULL_SOCKS_PORT:-1081}"      # SOCKS5 (full tunnel)
    volumes:
      - conduit_data:/data
    environment:
      - CONDUIT_WEB_PORT=${CONDUIT_WEB_PORT:-7782}
      - CONDUIT_API_PORT=${CONDUIT_API_PORT:-8000}
      - CONDUIT_HYBRID_HTTP_PORT=${CONDUIT_HYBRID_HTTP_PORT:-8080}
      - CONDUIT_FULL_HTTP_PORT=${CONDUIT_FULL_HTTP_PORT:-8081}
      - CONDUIT_HYBRID_SOCKS_PORT=${CONDUIT_HYBRID_SOCKS_PORT:-1080}
      - CONDUIT_FULL_SOCKS_PORT=${CONDUIT_FULL_SOCKS_PORT:-1081}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - DATABASE_PATH=/data/conduit.db
      - SINGBOX_CONFIG_PATH=/data/singbox_config.json
    restart: unless-stopped

volumes:
  conduit_data: {}
